[rules]
max_position_pct = 5
target_stock = 40
target_index = 30
target_hedge = 30
; лимит на тему из [groups], % от чистых активов
max_group_pct = 10
; позиции дешевле этого % активов — в блок «мелкие»
small_position_pct = 1
; убыток к средней цене, при котором позиция идёт в блок «на пересмотр», %
review_loss_pct = 30

[groups]
; тема = тикеры через запятую (без суффикса биржи); одна бумага может входить в несколько тем
золото = GLD, IAU
Китай = FXI, KWEB, MCHI, PDD, JD
здравоохранение = XLV, IXJ

[classes]
; тикер (с суффиксом биржи или без) = stock | index | hedge
GLD = hedge
